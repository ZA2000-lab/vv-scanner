<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scanner">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Cash-secured put scanner: thousands of stocks and ETFs graded by IV rank, premium, win odds and earnings risk.">
<title>optionscanners.com</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#E9EDF3; --line:#E3E8EF; --line2:#EEF1F5;
  --ink:#0A2540; --muted:#5B6B82; --faint:#8193AB;
  --accent:#2F5BFF; --accent-soft:#EAF0FF;
  --good:#0E9F6E; --good-ink:#0E7A55; --good-soft:#E7F6EF;
  --bad:#E5484D; --bad-soft:#FDE3E4; --warn:#B7791F; --warn-soft:#FDF3E1;
  --r-lg:16px; --r-md:12px; --r-sm:9px;
  --shadow:0 1px 2px rgba(10,37,64,.06),0 8px 24px -12px rgba(10,37,64,.18);
  --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.4;min-height:100vh;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Header ---------- */
#top{background:var(--surface);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;position:sticky;top:0;z-index:40}
.top-in{max-width:1240px;margin:0 auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.015em;color:var(--ink)}
.brand .wm{font-weight:700}
.brand span{color:var(--faint);font-weight:500}
.mark{width:26px;height:26px;flex:0 0 26px}
.nav-d{display:none;gap:4px;margin-left:24px}
.nav-d button,.nav-d a{padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:500;font-size:14px}
.nav-d a:hover,.nav-d button:hover{color:var(--ink)}
.nav-d button.on{background:var(--sunk);color:var(--ink);font-weight:600}
.icons{display:flex;gap:4px;margin-left:auto}
.ibtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.ibtn:active{background:var(--sunk)}
.ibtn svg{width:20px;height:20px}
.ibtn.spin svg{animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.mkt{display:flex;gap:6px;margin-top:12px}
.tile{flex:1;min-width:0;background:var(--bg);border-radius:var(--r-sm);padding:7px 9px}
.tile .l{font-size:11px;color:var(--muted)}
.tile .v{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .c{font-size:11px;font-weight:600}
.tile .l{display:flex;justify-content:space-between}
.up{color:var(--good)} .dn{color:var(--bad)}
.regime{margin-top:9px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.regime .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:0 0 8px}
.regime b{color:var(--ink);font-weight:600}

/* ---------- Layout ---------- */
main{max-width:1240px;margin:0 auto;padding:14px 14px calc(92px + var(--safe-b))}
.seg{display:flex;background:var(--sunk);border-radius:11px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;white-space:nowrap;font-size:13px;padding:8px 10px;border-radius:9px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(10,37,64,.12)}
.tools{display:flex;gap:8px;margin-top:10px}
.search{flex:1;position:relative}
.search input{width:100%;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:0 12px 0 36px;font-size:15px;outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:11px;top:11px;width:18px;height:18px;color:var(--faint)}
.tbtn{height:40px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:11px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tbtn .n{background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 6px}
.tbtn select{border:0;background:transparent;font-weight:600;color:var(--accent);outline:none;-webkit-appearance:none;appearance:none;padding-right:2px}
.sortl select{border:0;background:transparent;font-weight:600;color:var(--accent);outline:none;font-size:12.5px;padding:0 2px;-webkit-appearance:none;appearance:none;cursor:pointer}
.sortl select:focus-visible{outline:2px solid var(--accent)}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);padding:10px 2px 2px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12.5px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:4px 10px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.chip button{color:var(--accent);font-weight:700;line-height:1}

/* ---------- Cards ---------- */
.grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 15px 13px;cursor:pointer;text-align:left;width:100%;display:block;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:#C9D3E1;box-shadow:var(--shadow)}
.c-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.c-id{display:flex;align-items:center;gap:9px;min-width:0}
.tk{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.nm{font-size:12.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.S{background:var(--good-soft);color:var(--good-ink)}
.pill.D{background:var(--accent-soft);color:var(--accent)}
.pill.K{background:var(--sunk);color:var(--muted)}
.ann{font-size:19px;font-weight:700;text-align:right;line-height:1.1;white-space:nowrap}
.ann small{display:block;font-size:11px;color:var(--faint);font-weight:500;margin-top:2px}
.star{color:var(--faint);padding:2px}
.star.on{color:#F5A524}
.star svg{width:17px;height:17px;display:block}
.note{font-size:12.5px;margin-top:9px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{border-radius:6px;padding:2px 7px;font-size:11.5px;font-weight:500}
.tag.w{background:var(--warn-soft);color:var(--warn)} .tag.b{background:var(--bad-soft);color:#B4232A} .tag.g{background:var(--good-soft);color:var(--good-ink)} .tag.n{background:var(--sunk);color:var(--muted)}

/* signature price line */
.pl{position:relative;height:50px;margin:14px 2px 0}
.pl .rail{position:absolute;left:0;right:0;top:22px;height:6px;border-radius:3px;background:var(--sunk)}
.pl .loss{position:absolute;left:0;top:22px;height:6px;border-radius:3px 0 0 3px;background:var(--bad-soft)}
.pl .em{position:absolute;top:19px;height:12px;border-radius:6px;background:rgba(47,91,255,.10);border:1px dashed rgba(47,91,255,.45)}
.pl .tick{position:absolute;top:13px;width:2px;height:24px;border-radius:1px;margin-left:-1px}
.pl .lab{position:absolute;font-size:10.5px;white-space:nowrap;font-weight:600;line-height:1}
.pl .lab.t{top:0} .pl .lab.b{top:40px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-top:1px solid var(--line2);padding-top:10px;margin-top:10px}
.stats div{font-size:11px;color:var(--faint);min-width:0}
.stats b{display:block;font-size:14px;color:var(--ink);font-weight:600;margin-top:1px;white-space:nowrap}

/* ---------- Status panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 18px;margin-top:12px}
.panel h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
.panel p{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.5;max-width:60ch}
.prog{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;margin:16px 0 8px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px;width:0;transition:width .6s ease}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.steps div{background:var(--bg);border-radius:10px;padding:9px 10px;font-size:12px;color:var(--muted)}
.steps b{display:block;font-size:16px;color:var(--ink);font-weight:600}
.btn{height:44px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.p{background:var(--accent);color:#fff}
.btn.s{background:var(--sunk);color:var(--ink)}
.btn.g{border:1px solid var(--line);background:var(--surface)}
.btn:disabled{opacity:.5}
.empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:14px}
.demo{background:var(--warn-soft);color:var(--warn);font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:10px}

/* ---------- Bottom nav ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + var(--safe-b))}
#nav button,#nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--faint);font-weight:500;padding:5px 0}
#nav svg{width:22px;height:22px}
#nav .on{color:var(--accent);font-weight:600}

/* ---------- Sheet ---------- */
#scrim{position:fixed;inset:0;background:rgba(10,37,64,.38);z-index:60;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 18px calc(24px + var(--safe-b));display:none;box-shadow:0 -10px 40px rgba(10,37,64,.2)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 10px}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:sticky;top:-8px;background:var(--surface);padding:8px 0 10px;z-index:2}
.sh-h .tk{font-size:24px}
.x{width:34px;height:34px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;flex:0 0 34px}
.x svg{width:16px;height:16px}
.sec{margin-top:18px}
.sec h4{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:8px}
.big-ann{display:flex;gap:18px;align-items:baseline;margin-top:4px;flex-wrap:wrap}
.big-ann b{font-size:30px;font-weight:700;letter-spacing:-.02em}
.big-ann span{font-size:13px;color:var(--muted)}
.ladder{width:100%;border-collapse:collapse;font-size:13.5px}
.ladder th{font-size:11px;color:var(--faint);font-weight:500;text-align:right;padding:0 6px 6px}
.ladder th:first-child,.ladder td:first-child{text-align:left}
.ladder td{text-align:right;padding:9px 6px;border-top:1px solid var(--line2);cursor:pointer}
.ladder tr.sel td{background:var(--accent-soft)}
.ladder tr.sel td:first-child{border-radius:8px 0 0 8px;font-weight:700;color:var(--accent)}
.ladder tr.sel td:last-child{border-radius:0 8px 8px 0}
.ticket{background:var(--bg);border-radius:var(--r-md);padding:14px}
.ticket .order{font-size:17px;font-weight:600;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:12px}
.kv div{font-size:12px;color:var(--muted)}
.kv b{display:block;font-size:15px;color:var(--ink);font-weight:600;margin-top:1px}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line2);font-size:14px}
.rows div:first-child{border-top:0}
.rows span{color:var(--muted)}
.rows b{font-weight:600;text-align:right}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.fine{font-size:12px;color:var(--faint);margin-top:14px;line-height:1.5}
.spark{width:100%;height:56px;display:block;margin-top:8px}

/* forms */
.fld{margin-top:14px}
.fld label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.fld .hint{font-size:12px;color:var(--faint);font-weight:400;margin-left:4px}
.inp{width:100%;height:44px;border:1px solid var(--line);border-radius:11px;padding:0 12px;font-size:16px;background:var(--surface);outline:none}
.inp:focus{border-color:var(--accent)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line2);font-size:14.5px;gap:12px}
.sw small{display:block;font-size:12px;color:var(--faint)}
.tog{position:relative;width:46px;height:28px;flex:0 0 46px}
.tog input{opacity:0;width:0;height:0;position:absolute}
.tog i{position:absolute;inset:0;background:var(--line);border-radius:14px;transition:background .15s}
.tog i:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.tog input:checked + i{background:var(--accent)}
.tog input:checked + i:after{transform:translateX(18px)}
.choice{display:flex;flex-wrap:wrap;gap:6px}
.choice button{border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-size:13px;color:var(--muted)}
.choice button.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* lookup + playbook */
.look{display:flex;gap:8px;margin-top:4px}
.look .inp{text-transform:uppercase;font-weight:600;letter-spacing:.02em}
.recent{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.recent button{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600}
.pb{display:grid;gap:10px;margin-top:4px}
.pb .panel{margin-top:0}
.pb h3{margin-bottom:4px}
.pb ul{list-style:none;margin-top:10px}
.pb li{padding:10px 0;border-top:1px solid var(--line2);font-size:14px;color:var(--muted);line-height:1.5}
.pb li:first-child{border-top:0}
.pb li b{color:var(--ink);font-weight:600;display:block}
.h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:4px 2px 12px}

#toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:14px;padding:10px 16px;border-radius:12px;z-index:80;display:none;max-width:90vw}

/* lock */
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#lock .box{width:100%;max-width:340px;text-align:center}
#lock .mark{width:52px;height:52px;margin:0 auto 18px}
#lock h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
#lock p{color:var(--muted);font-size:14px;margin:6px 0 22px}
#lock .inp{text-align:center;margin-bottom:10px}
#lock .btn{width:100%}
#lock .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}

/* ---------- Desktop ---------- */
@media (min-width:720px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
  .nm{max-width:240px}
}
@media (min-width:980px){
  #nav{display:none}
  .nav-d{display:flex}
  main{padding-bottom:40px}
  .mkt{max-width:640px}
  #top .bar2{display:flex;gap:24px;align-items:flex-end;justify-content:space-between}
  .regime{margin-top:0;max-width:520px}
  .sheet{left:auto;top:0;bottom:0;width:460px;max-height:none;border-radius:0;padding-top:calc(16px + env(safe-area-inset-top))}
  .grab{display:none}
  #toast{bottom:28px}
}
</style>
</head>

<script>
/* optionscanners.com — scanner front end (vanilla JS, no build step) */
var API = "https://vv-scanner-production.up.railway.app";
var PASS_HASH = "064be7d4d8445ef35466d668447740752c02f4ae6809923f1faad6c966c77709"; // sha256 of the access password
var DEMO = window.OS_DEMO === true || location.hash === "#demo";

/* ---------- storage ---------- */
var LS = {
  get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
var DEFAULT_PREFS = { bp: 0, fitOnly: false, minPrice: 0, minAnn: 0, minPop: 0, hideEarn: false, etfs: true, lev: false, sectors: [], sort: "score" };
var prefs = Object.assign({}, DEFAULT_PREFS, LS.get("os_prefs", {}));
var watch = LS.get("os_watch", []);
var recent = LS.get("os_recent", []);

/* ---------- state ---------- */
var S = { data: null, results: [], seg: "STRONG", q: "", view: "scan", limit: 60, open: null, ladderIdx: null,
          polling: null, t0: Date.now(), failures: 0, lastFull: 0, lookups: {} };

/* ---------- helpers ---------- */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function money(n, d) { if (n == null || isNaN(n)) return "–"; d = d == null ? 2 : d; return "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }); }
function kmoney(n) { if (n == null) return "–"; return n >= 1000 ? "$" + (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : "$" + Math.round(n); }
function pct(n, d) { return n == null || isNaN(n) ? "–" : Number(n).toFixed(d == null ? 1 : d) + "%"; }
function sgn(n) { return (n >= 0 ? "+" : "") + Number(n).toFixed(2) + "%"; }
function fmtExp(s) { if (!s) return "–"; var d = new Date(s + "T12:00:00"); return d.toLocaleDateString("en-US", { month: "short", day: "numeric" }); }
function gradeWord(q) { return q === "STRONG" ? "Strong" : q === "DECENT" ? "Decent" : "Skip"; }
function gradeCls(q) { return q === "STRONG" ? "S" : q === "DECENT" ? "D" : "K"; }
function icon(id, cls) { return '<svg' + (cls ? ' class="' + cls + '"' : '') + '><use href="#' + id + '"/></svg>'; }
function toast(msg) { var t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = "none"; }, 2600); }

function getJSON(url, opts, ms) {
  var ctl = new AbortController();
  var timer = setTimeout(function () { ctl.abort(); }, ms || 20000);
  opts = Object.assign({ signal: ctl.signal }, opts || {});
  return fetch(url, opts).then(function (r) {
    clearTimeout(timer);
    return r.json().then(function (j) { j._status = r.status; return j; });
  }, function (e) { clearTimeout(timer); throw e; });
}

/* ---------- password gate ---------- */
function sha256(s) {
  if (!(window.crypto && crypto.subtle)) return Promise.resolve(null);
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function (buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
  });
}
function gate(next) {
  var ok = false;
  try { ok = sessionStorage.getItem("os_auth") === "1" || localStorage.getItem("os_auth_keep") === PASS_HASH; } catch (e) {}
  if (ok || DEMO) return next();
  var el = document.createElement("div");
  el.id = "lock";
  el.innerHTML = '<form class="box" autocomplete="off"><svg class="mark"><use href="#i-mark"/></svg><h1>optionscanners.com</h1><p>Enter your access code to continue.</p>' +
    '<input class="inp" type="password" id="pw" placeholder="Access code" aria-label="Access code" autocomplete="current-password">' +
    '<button class="btn p" type="submit">Unlock</button><label class="sw" style="justify-content:center;border:0;font-size:13px;color:var(--muted)"><input type="checkbox" id="keep"> Keep me signed in on this device</label><div class="err" id="pw-err"></div></form>';
  document.body.appendChild(el);
  document.documentElement.style.overflow = "hidden";
  setTimeout(function () { var i = $("pw"); if (i) i.focus(); }, 120);
  el.querySelector("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("pw").value;
    sha256(v).then(function (h) {
      if (h === PASS_HASH) {
        try { sessionStorage.setItem("os_auth", "1"); if ($("keep").checked) localStorage.setItem("os_auth_keep", PASS_HASH); } catch (x) {}
        el.remove(); document.documentElement.style.overflow = ""; next();
      } else {
        $("pw-err").textContent = h === null ? "This browser can't verify the code. Open the site over https." : "That code didn't match. Try again.";
        $("pw").value = "";
      }
    });
  });
}

/* ---------- market header ---------- */
function renderMarket(m) {
  var box = $("mkt"), rg = $("regime");
  if (!m || !m.SPY) { box.innerHTML = ""; rg.classList.add("hide"); return; }
  var items = [["S&P 500", "SPY"], ["Nasdaq 100", "QQQ"], ["Russell", "IWM"], ["VIX", "VIX"]];
  box.innerHTML = items.filter(function (it) { return m[it[1]]; }).map(function (it) {
    var d = m[it[1]], up = d.chg >= 0;
    var cls = it[1] === "VIX" ? (up ? "dn" : "up") : (up ? "up" : "dn");
    return '<div class="tile"><div class="l"><span>' + it[1] + '</span><span class="c ' + cls + '">' + sgn(d.chg) + '</span></div><div class="v">' + d.price.toFixed(2) + '</div></div>';
  }).join("");
  if (m.regime) {
    var col = { rich: "var(--good)", calm: "var(--accent)", caution: "var(--warn)", soft: "var(--warn)", stress: "var(--bad)" }[m.regime.label] || "var(--faint)";
    var parts = m.regime.note.split(": "), head = parts[0], rest = parts.slice(1).join(": ");
    rest = rest ? rest.charAt(0).toUpperCase() + rest.slice(1) : "";
    rg.innerHTML = '<span class="dot" style="background:' + col + '"></span><span><b>' + esc(head) + '.</b> ' + esc(rest) + '</span>';
    rg.classList.remove("hide");
  }
}

/* ---------- filtering ---------- */
function passes(r) {
  if (prefs.fitOnly && prefs.bp > 0 && r.collateral > prefs.bp) return false;
  if (prefs.minPrice && r.price < prefs.minPrice) return false;
  if (prefs.minAnn && r.rocAnn < prefs.minAnn) return false;
  if (prefs.minPop && (r.pop || 0) * 100 < prefs.minPop) return false;
  if (prefs.hideEarn && r.earningsWithin) return false;
  if (!prefs.etfs && r.isEtf) return false;
  if (!prefs.lev && r.isEtf && /Leveraged/.test(r.industry || "")) return false;
  if (prefs.sectors.length && prefs.sectors.indexOf(r.sector) < 0) return false;
  if (S.q) {
    var q = S.q.toUpperCase();
    if (r.ticker.indexOf(q) !== 0 && (r.name || "").toUpperCase().indexOf(q) < 0 && (r.sector || "").toUpperCase().indexOf(q) < 0) return false;
  }
  return true;
}
function activeFilterCount() {
  var n = 0;
  if (prefs.fitOnly && prefs.bp > 0) n++;
  if (prefs.minPrice) n++; if (prefs.minAnn) n++; if (prefs.minPop) n++;
  if (prefs.hideEarn) n++; if (!prefs.etfs) n++; if (prefs.lev) n++;
  if (prefs.sectors.length) n++;
  return n;
}
function sorted(list) {
  var k = prefs.sort, asc = k === "collateral";
  return list.slice().sort(function (a, b) {
    var x = a[k] == null ? 0 : a[k], y = b[k] == null ? 0 : b[k];
    return asc ? x - y : y - x;
  });
}

/* ---------- price line ---------- */
function priceLine(r, s) {
  s = s || { strike: r.putStrike, breakeven: r.breakeven };
  var em = r.expectedMove || r.price * (r.atm_iv / 100) * Math.sqrt(r.dte / 365);
  var lo = Math.min(s.breakeven, r.price - em) , hi = r.price + em;
  var pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  function x(v) { return Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100)); }
  var be = x(s.breakeven), st = x(s.strike), now = x(r.price), e1 = x(r.price - em), e2 = x(r.price + em);
  function lab(pos, cls, color, text) {
    var al = pos < 18 ? "left:" + pos + "%" : pos > 82 ? "right:" + (100 - pos) + "%" : "left:" + pos + "%;transform:translateX(-50%)";
    return '<span class="lab ' + cls + '" style="' + al + ';color:' + color + '">' + text + '</span>';
  }
  var close = Math.abs(be - st) < 14;
  return '<div class="pl" aria-label="Breakeven ' + s.breakeven + ', strike ' + s.strike + ', price ' + r.price + '">' +
    '<div class="rail"></div><div class="loss" style="width:' + be + '%"></div>' +
    '<div class="em" style="left:' + e1 + '%;width:' + (e2 - e1) + '%"></div>' +
    '<div class="tick" style="left:' + be + '%;background:var(--bad)"></div>' +
    '<div class="tick" style="left:' + st + '%;background:var(--ink)"></div>' +
    '<div class="tick" style="left:' + now + '%;background:var(--accent)"></div>' +
    lab(be, "t", "var(--bad)", "Breakeven " + s.breakeven.toFixed(2)) +
    lab(now, "t", "var(--accent)", "Now " + r.price.toFixed(2)) +
    lab(close ? st : st, "b", "var(--ink)", "Strike " + s.strike) +
    (Math.abs(e2 - st) > 30 ? lab(Math.min(e2, 96), "b", "var(--faint)", "±" + money(em) + " expected") : "") +
    '</div>';
}

/* ---------- cards ---------- */
function earnTag(r) {
  if (r.earningsWithin) return '<span class="tag b">Earnings ' + esc(r.earningsDate) + ', before expiry</span>';
  if (r.earningsDate && r.earningsDays != null && r.earningsDays <= 60) return '<span class="tag n">Earnings ' + esc(r.earningsDate) + '</span>';
  return "";
}
function cardHTML(r) {
  var w = watch.indexOf(r.ticker) >= 0;
  var tags = earnTag(r);
  if (r.trend === "down") tags += '<span class="tag w">Downtrend</span>';
  if (r.openInterest < 100) tags += '<span class="tag w">Thin open interest</span>';
  if (prefs.bp > 0 && r.collateral > prefs.bp) tags += '<span class="tag n">Needs ' + kmoney(r.collateral) + '</span>';
  return '<article class="card" data-t="' + esc(r.ticker) + '" tabindex="0" role="button" aria-label="' + esc(r.ticker) + ' details">' +
    '<div class="c-h"><div class="c-id"><div><div class="tk">' + esc(r.ticker) + '</div><div class="nm">' + money(r.price) + ' · ' + esc(r.isEtf ? "ETF" : (r.sector || "")) + '</div></div>' +
    '<span class="pill ' + gradeCls(r.quality) + '">' + gradeWord(r.quality) + '</span>' +
    '<button class="star' + (w ? " on" : "") + '" data-star="' + esc(r.ticker) + '" aria-label="' + (w ? "Remove from" : "Add to") + ' watchlist">' + icon(w ? "i-star" : "i-staro") + '</button></div>' +
    '<div class="ann">' + pct(r.rocAnn) + '<small>annualized</small></div></div>' +
    priceLine(r) +
    '<div class="stats"><div>Premium<b>' + money(r.premium) + '</b></div><div>Win odds<b>' + Math.round((r.pop || 0) * 100) + '%</b></div><div>IV rank<b>' + r.ivRank + '</b></div><div>Cash<b>' + kmoney(r.collateral) + '</b></div></div>' +
    (tags ? '<div class="note">' + tags + '</div>' : "") +
    '</article>';
}

function counts() {
  var c = { STRONG: 0, DECENT: 0, SKIP: 0, ALL: 0, WATCH: 0 };
  S.results.forEach(function (r) { if (!passesNoSeg(r)) return; c[r.quality]++; c.ALL++; if (watch.indexOf(r.ticker) >= 0) c.WATCH++; });
  return c;
}
function passesNoSeg(r) { return passes(r); }

function renderSeg() {
  var c = counts();
  var segs = [["STRONG", "Strong"], ["DECENT", "Decent"], ["SKIP", "Skip"], ["ALL", "All"], ["WATCH", "Watchlist"]];
  $("seg").innerHTML = segs.map(function (s) {
    return '<button role="tab" aria-selected="' + (S.seg === s[0]) + '" class="' + (S.seg === s[0] ? "on" : "") + '" data-seg="' + s[0] + '">' + s[1] + " " + c[s[0]] + "</button>";
  }).join("");
}

function renderChips() {
  var out = [];
  if (prefs.fitOnly && prefs.bp > 0) out.push(["fitOnly", "Fits " + kmoney(prefs.bp)]);
  if (prefs.minAnn) out.push(["minAnn", "≥ " + prefs.minAnn + "% a year"]);
  if (prefs.minPop) out.push(["minPop", "Win odds ≥ " + prefs.minPop + "%"]);
  if (prefs.minPrice) out.push(["minPrice", "Price ≥ $" + prefs.minPrice]);
  if (prefs.hideEarn) out.push(["hideEarn", "No earnings"]);
  if (!prefs.etfs) out.push(["etfs", "Stocks only"]);
  if (prefs.lev) out.push(["lev", "Leveraged ETFs on"]);
  prefs.sectors.forEach(function (s) { out.push(["sector:" + s, s]); });
  $("chips").innerHTML = out.map(function (c) { return '<span class="chip">' + esc(c[1]) + '<button data-clear="' + esc(c[0]) + '" aria-label="Remove filter">×</button></span>'; }).join("");
  var n = activeFilterCount(), f = $("fcount");
  f.textContent = n; f.classList.toggle("hide", !n);
}

function renderList() {
  renderSeg(); renderChips();
  var list = S.results.filter(function (r) {
    if (!passes(r)) return false;
    if (S.seg === "ALL") return true;
    if (S.seg === "WATCH") return watch.indexOf(r.ticker) >= 0;
    return r.quality === S.seg;
  });
  list = sorted(list);
  var d = S.data || {};
  var st = d.stats || {};
  var uni = st.universe || d.universe || 0;
  $("meta-l").textContent = (uni ? uni.toLocaleString() + " scanned" : "") + (d.scannedAt ? " · " + d.scannedAt : "") + (d.isRefreshing ? " · updating…" : "");
  var html = list.slice(0, S.limit).map(cardHTML).join("");
  if (!list.length && S.results.length) {
    html = '<div class="empty" style="grid-column:1/-1">' + (S.seg === "WATCH" ? "Your watchlist is empty here. Tap the star on any card to add it." :
      S.seg === "STRONG" ? "No strong setups pass your filters right now. Try Decent, or loosen a filter." : "Nothing matches these filters.") + '</div>';
  }
  $("list").innerHTML = html;
  $("more").innerHTML = list.length > S.limit ? '<div style="text-align:center;margin-top:14px"><button class="btn g" id="btn-more">Show ' + Math.min(60, list.length - S.limit) + ' more of ' + (list.length - S.limit) + '</button></div>' : "";
}

/* ---------- status / progress ---------- */
function renderStatus(p, err) {
  var box = $("status");
  if (S.results.length && !err) {
    if (p && S.data && S.data.isRefreshing) {
      var pct2 = phasePct(p);
      box.innerHTML = '<div class="meta" style="padding-top:6px"><span>New scan running: ' + esc(phaseText(p)) + '</span><span>' + pct2 + '%</span></div><div class="prog" style="margin:4px 0 0"><i style="width:' + pct2 + '%"></i></div>';
    } else box.innerHTML = "";
    return;
  }
  if (err) {
    var secs = Math.floor((Date.now() - S.t0) / 1000);
    box.innerHTML = '<div class="panel"><h3>' + (secs < 75 ? "Waking up the scanner…" : "Can't reach the scanner") + '</h3><p>' +
      (secs < 75 ? "The server sleeps when idle and takes up to a minute to start. " + secs + "s so far." :
        "The server hasn't answered for " + secs + "s. It may be redeploying. This page keeps retrying, or you can try now.") + '</p>' +
      (secs >= 75 ? '<div style="margin-top:14px"><button class="btn s" id="btn-retry">Try again</button></div>' : '<div class="prog"><i style="width:' + Math.min(95, secs / 75 * 100) + '%"></i></div>') + '</div>';
    return;
  }
  p = p || {};
  var pc = phasePct(p);
  box.innerHTML = '<div class="panel"><h3>Scanning the market</h3><p>' + esc(phaseText(p)) + '. Results appear as soon as the first batch is scored.</p>' +
    '<div class="prog"><i style="width:' + pc + '%"></i></div>' +
    '<div class="steps"><div>Universe<b>' + ((S.data && S.data.universe) || p.total || "–").toLocaleString() + '</b></div><div>Liquid<b>' + (p.passed || "–").toLocaleString() + '</b></div><div>Setups<b>' + (p.found || 0) + '</b></div></div></div>';
}
function phasePct(p) {
  if (!p || !p.phase) return 0;
  if (p.phase.indexOf("bulk") === 0) { var m = p.phase.match(/(\d+)\/(\d+)/); return m ? Math.round(m[1] / m[2] * 40) : 5; }
  if (p.phase === "scoring options") return 40 + Math.round((p.done / Math.max(p.total, 1)) * 60);
  return p.phase === "done" ? 100 : 0;
}
function phaseText(p) {
  if (!p || !p.phase || p.phase === "idle") return "Starting up";
  if (p.phase.indexOf("bulk") === 0) return "Pulling a year of prices (" + p.phase.replace("bulk download ", "batch ") + ")";
  if (p.phase === "scoring options") return "Reading option chains: " + p.done + " of " + p.total + ", " + (p.found || 0) + " setups so far";
  return "Finishing";
}

/* ---------- data loading ---------- */
function applyScan(d) {
  S.data = d;
  S.failures = 0;
  if (d.results && d.results.length) S.results = d.results;
  renderMarket(d.market);
  renderStatus(d.progress);
  if (S.view === "scan") renderList();
  var busy = d.isRefreshing || (!d.results || !d.results.length);
  $("btn-refresh").classList.toggle("spin", !!d.isRefreshing);
  schedule(busy ? 4000 : 120000);
}
function loadScan() {
  if (DEMO) { applyScan(demoData()); return; }
  getJSON(API + "/api/scan", null, 25000).then(applyScan).catch(function () {
    S.failures++;
    renderStatus(null, true);
    schedule(S.failures < 3 ? 4000 : 8000);
  });
}
function schedule(ms) { clearTimeout(S.polling); S.polling = setTimeout(loadScan, ms); }

function refresh(force) {
  if (DEMO) { toast("Demo mode: scans are simulated."); return; }
  var b = $("btn-refresh");
  b.classList.add("spin");
  getJSON(API + "/api/refresh" + (force ? "?force=1" : ""), { method: "POST" }, 15000).then(function (j) {
    if (j._status === 429) {
      showConfirm("This scan is " + (S.data && S.data.ageMinutes != null ? S.data.ageMinutes + " minutes" : "only a few minutes") + " old.",
        "A full rescan takes about 8 minutes and leans on Yahoo's rate limits. Run it anyway?", "Rescan now", function () { refresh(true); });
      b.classList.remove("spin");
      return;
    }
    toast(j.running ? "A scan is already running." : "New scan started. Current results stay up until it finishes.");
    schedule(1500);
  }).catch(function () { b.classList.remove("spin"); toast("Couldn't reach the scanner. Try again in a moment."); });
}

function findR(t) { return S.results.filter(function (r) { return r.ticker === t; })[0] || S.lookups[t]; }

/* ---------- detail sheet ---------- */
function openSheet(html) {
  var sh = $("sheet");

function sparkSVG(pts, r, s) {
  if (!pts || pts.length < 3) return "";
  var all = pts.concat([s.strike]);
  var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all), W = 300, H = 56;
  function y(v) { return (H - 4) - (v - lo) / ((hi - lo) || 1) * (H - 8); }
  var d = pts.map(function (v, i) { return (i ? "L" : "M") + (i / (pts.length - 1) * W).toFixed(1) + " " + y(v).toFixed(1); }).join(" ");
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-label="Price over the last 3 months with your strike">' +
    '<line x1="0" x2="' + W + '" y1="' + y(s.strike) + '" y2="' + y(s.strike) + '" stroke="#0A2540" stroke-dasharray="3 4" stroke-width="1" vector-effect="non-scaling-stroke"/>' +
    '<path d="' + d + '" fill="none" stroke="#2F5BFF" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>';
}

function detailHTML(r) {
  var lad = r.ladder && r.ladder.length ? r.ladder : [{ strike: r.putStrike, delta: r.delta, mid: r.premium, bid: r.bid, ask: r.ask, spreadPct: r.spreadPct, oi: r.openInterest, breakeven: r.breakeven, otmPct: r.otmPct, rocPct: r.rocPct, pop: r.pop, thetaDay: r.thetaDay }];
  if (S.ladderIdx == null || !lad[S.ladderIdx]) {

  }
  var s = lad[S.ladderIdx];

  var h = '<div class="grab"></div><div class="sh-h"><div><div style="display:flex;gap:9px;align-items:center"><div class="tk">' + esc(r.ticker) + '</div><span class="pill ' + gradeCls(r.quality) + '">' + gradeWord(r.quality) + '</span><span class="tag n">Score ' + r.score + '</span></div>' +
    '<div class="nm" style="max-width:none;white-space:normal;margin-top:3px">' + esc(r.name) + ' · ' + money(r.price) + ' <span class="' + (r.chg1d >= 0 ? "up" : "dn") + '">' + sgn(r.chg1d || 0) + '</span></div></div>' +
    '<button class="x" data-close aria-label="Close">' + icon("i-x") + '</button></div>';

  h += '<div class="big-ann"><b>' + pct(ann) + '</b><span>annualized if it expires worthless</span></div>';
  h += '<p style="font-size:14px;color:var(--muted);margin-top:8px;line-height:1.5">' + esc(verdict) + '</p>';
  h += priceLine(r, s);

  h += '<div class="sec"><h4>Pick a strike · ' + fmtExp(r.expiration) + ' expiry, ' + r.dte + ' days</h4><table class="ladder"><thead><tr><th>Strike</th><th>Delta</th><th>Mid</th><th>Win odds</th><th>Yearly</th></tr></thead><tbody>' +
    lad.map(function (l, i) {

    }).join("") + '</tbody></table></div>';

  var orderText = "Sell to open 1 " + r.ticker + " " + fmtExp(r.expiration) + " " + new Date(r.expiration + "T12:00:00").getFullYear() + " $" + s.strike + " put, limit " + money(s.mid);
  h += '<div class="sec"><h4>Order ticket</h4><div class="ticket"><div class="order">Sell ' + r.ticker + ' $' + s.strike + ' put</div>' +
    '<div style="font-size:13px;color:var(--muted);margin-top:2px">' + fmtExp(r.expiration) + ' · limit ' + money(s.mid) + ' (bid ' + money(s.bid) + ' / ask ' + money(s.ask) + ', ' + s.spreadPct + '% wide)</div>' +
    '<div class="kv"><div>Premium per contract<b>' + money(s.mid * 100, 0) + '</b></div><div>Cash to secure<b>' + money(coll, 0) + '</b></div>' +
    '<div>Breakeven<b>' + money(s.breakeven) + '</b></div><div>Cushion below price<b>' + pct(s.otmPct) + '</b></div>' +
    '<div>Time decay per day<b>' + money(s.thetaDay) + '</b></div><div>Open interest<b>' + (s.oi || 0).toLocaleString() + '</b></div></div>' +
    (contracts != null ? '<div style="font-size:13px;margin-top:12px;color:' + (contracts ? "var(--ink)" : "var(--bad)") + '">' + (contracts ? "Your " + kmoney(prefs.bp) + " covers " + contracts + " contract" + (contracts > 1 ? "s" : "") + " (" + Math.round(coll / prefs.bp * 100) + "% of buying power each)." : "Needs " + money(coll, 0) + ", more than your " + kmoney(prefs.bp) + " buying power.") + '</div>' : "") +
    '</div></div>';

  h += '<div class="sec"><h4>Plan</h4><div class="rows">' +

    '<div><span>If assigned</span><b>Own 100 at ' + money(s.breakeven) + ' net, sell a ~$' + cc + ' call</b></div></div></div>';

  h += '<div class="sec"><h4>Context</h4>' + sparkSVG(r.spark, r, s) + '<div class="rows" style="margin-top:6px">' +
    '<div><span>IV rank' + (r.ivRankSource === "proxy" ? " (estimated)" : "") + '</span><b>' + r.ivRank + ' · IV ' + pct(r.atm_iv) + ' vs realized ' + pct(r.rv30) + '</b></div>' +
    '<div><span>Trend</span><b>' + ({ up: "Above 50 & 200-day", down: "Below 50 & 200-day", mixed: "Mixed" }[r.trend] || "–") + '</b></div>' +
    '<div><span>50 / 200-day average</span><b>' + money(r.sma50) + ' / ' + (r.sma200 ? money(r.sma200) : "–") + '</b></div>' +
    '<div><span>60-day low</span><b>' + money(r.low60) + '</b></div>' +
    '<div><span>52-week range</span><b>' + money(r.lo52) + ' – ' + money(r.hi52) + '</b></div>' +
    '<div><span>Expected move by expiry</span><b>±' + money(r.expectedMove) + '</b></div>' +
    '<div><span>Next earnings</span><b>' + (r.earningsDate ? esc(r.earningsDate) + (r.earningsDays != null ? " (" + r.earningsDays + " days)" : "") : r.isEtf ? "ETF, none" : "None found") + '</b></div>' +
    '<div><span>Avg daily volume</span><b>' + (r.avgVol || 0).toLocaleString() + ' sh</b></div></div>' +
    (good.length || bad.length ? '<div class="note" style="margin-top:10px">' + good.map(function (g) { return '<span class="tag g">' + esc(g) + '</span>'; }).join("") + bad.map(function (b) { return '<span class="tag w">' + esc(b) + '</span>'; }).join("") + '</div>' : "") + '</div>';

  h += '<div class="acts"><button class="btn p" data-log>Log in tracker</button><button class="btn s" data-copy="' + esc(orderText) + '">Copy order</button>' +
    '<button class="btn g" data-star="' + esc(r.ticker) + '" style="grid-column:1/-1">' + (w ? "Remove from watchlist" : "Add to watchlist") + '</button></div>';
  h += '<p class="fine">Quotes from Yahoo Finance, delayed and scanned ' + esc((S.data && S.data.scannedAt) || "recently") + '. Win odds are model estimates from implied volatility, not a forecast. ' +
    (r.ivRankSource === "proxy" ? "IV rank is estimated against a year of realized volatility until 20 days of IV history build up. " : "") + 'Confirm the live chain at your broker before trading. Not financial advice.</p>';
  return h;
}
function whyNotStrong(r) {
  var miss = [];
  if (r.ivRank < 60) miss.push("IV rank " + r.ivRank + " (wants 60+)");
  if (r.ivRvRatio < 1.2) miss.push("IV/RV " + r.ivRvRatio + "× (wants 1.2+)");
  if (r.spreadPct > 8) miss.push("spread " + r.spreadPct + "% (wants ≤8%)");
  return miss.length ? "Short on " + miss.join(", ") + "." : "Below threshold this cycle.";
}
function openDetail(t) {
  var r = findR(t); if (!r) return;

}

/* ---------- lookup ---------- */
function renderRecent() {
  $("recent").innerHTML = recent.map(function (t) { return '<button data-look="' + esc(t) + '">' + esc(t) + '</button>'; }).join("");
}
function lookup(t) {
  t = (t || "").trim().toUpperCase().replace(".", "-");
  if (!/^[A-Z]{1,5}(-[A-Z])?$/.test(t)) { $("look-out").innerHTML = '<div class="empty">Enter a ticker symbol like AAPL or BRK-B.</div>'; return; }
  $("look-q").value = t;
  recent = [t].concat(recent.filter(function (x) { return x !== t; })).slice(0, 8); LS.set("os_recent", recent); renderRecent();
  var inScan = S.results.filter(function (r) { return r.ticker === t; })[0];
  if (inScan) { showLook(inScan, "From the latest scan."); return; }
  if (DEMO) { $("look-out").innerHTML = '<div class="empty">Lookups need the live server. Try a ticker from the demo list, like AMD.</div>'; return; }
  $("look-out").innerHTML = '<div class="panel"><h3>Analyzing ' + esc(t) + '…</h3><p>Pulling a year of prices and the option chain. Usually takes 5–15 seconds.</p><div class="prog"><i style="width:60%"></i></div></div>';
  getJSON(API + "/api/analyze?ticker=" + encodeURIComponent(t), null, 45000).then(function (j) {
    if (j.error) { $("look-out").innerHTML = '<div class="panel"><h3>No setup for ' + esc(t) + '</h3><p>' + esc(j.error) + '</p></div>'; return; }
    S.lookups[j.ticker] = j;
    showLook(j, j.liquidityWarning ? "Heads up: this one trades thinly, so fills may be worse than the mid." : "Live lookup.");
  }).catch(function () { $("look-out").innerHTML = '<div class="panel"><h3>Lookup timed out</h3><p>The server may be waking up or rate-limited. Try again in a minute.</p></div>'; });
}
function showLook(r, note) {
  $("look-out").innerHTML = '<p class="meta" style="padding:12px 2px 6px">' + esc(note) + '</p><div class="grid" style="margin-top:0">' + cardHTML(r) + '</div>';
}

document.addEventListener("click", function (e) {
  var el = e.target.closest ? e.target : e.target.parentNode;
  var star = el.closest("[data-star]");
  if (star) {
    e.stopPropagation();
    toggleWatch(star.getAttribute("data-star"));
    if (S.open) $("sheet").innerHTML = detailHTML(findR(S.open));
    if (S.view === "scan") renderList(); else if (S.view === "lookup") { var lr = findR(star.getAttribute("data-star")); if (lr) showLook(lr, ""); }
    return;
  }
  var card = el.closest(".card[data-t]");
  if (card) { openDetail(card.getAttribute("data-t")); return; }
  var b;
  if ((b = el.closest("[data-seg]"))) { S.seg = b.getAttribute("data-seg"); S.limit = 60; renderList(); return; }
  if ((b = el.closest("[data-view]"))) { setView(b.getAttribute("data-view")); return; }
  if ((b = el.closest("[data-close]")) || el.id === "scrim") { closeSheet(); return; }
  if ((b = el.closest("[data-lad]"))) { S.ladderIdx = +b.getAttribute("data-lad"); var keep = $("sheet").scrollTop; $("sheet").innerHTML = detailHTML(findR(S.open)); $("sheet").scrollTop = keep; return; }
  if ((b = el.closest("[data-copy]"))) {
    var txt = b.getAttribute("data-copy");
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { toast("Order copied"); }, function () { toast(txt); });
    else toast(txt);
    return;
  }
  if (el.closest("[data-log]")) { logTrade(); return; }
  if ((b = el.closest("[data-sec]"))) { b.classList.toggle("on"); return; }
  if (el.closest("[data-apply]")) { readFilters(); closeSheet(); S.limit = 60; renderList(); return; }
  if (el.closest("[data-reset]")) { var bp = prefs.bp; prefs = Object.assign({}, DEFAULT_PREFS, { bp: bp, sort: prefs.sort }); LS.set("os_prefs", prefs); closeSheet(); renderList(); return; }
  if ((b = el.closest("[data-clear]"))) {
    var k = b.getAttribute("data-clear");
    if (k.indexOf("sector:") === 0) prefs.sectors = prefs.sectors.filter(function (s) { return s !== k.slice(7); });
    else if (k === "etfs") prefs.etfs = true; else prefs[k] = DEFAULT_PREFS[k];
    LS.set("os_prefs", prefs); renderList(); return;
  }
  if ((b = el.closest("[data-look]"))) { lookup(b.getAttribute("data-look")); return; }
  if (el.closest("[data-signout]")) { try { sessionStorage.removeItem("os_auth"); localStorage.removeItem("os_auth_keep"); } catch (x) {} location.reload(); return; }
  if (el.closest("#btn-more")) { S.limit += 60; renderList(); return; }
  if (el.closest("#btn-retry")) { S.t0 = Date.now(); loadScan(); return; }
  if (el.closest("#btn-filters")) { openSheet(filtersHTML()); return; }
  if (el.closest("#btn-settings")) { openSheet(settingsHTML()); return; }
  if (el.closest("#btn-refresh")) { refresh(false); return; }
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && $("sheet").style.display === "block") closeSheet();
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("card")) { e.preventDefault(); openDetail(e.target.getAttribute("data-t")); }
});
$("q").addEventListener("input", function () { S.q = this.value.trim(); S.limit = 60; renderList(); });
$("sort").addEventListener("change", function () { prefs.sort = this.value; LS.set("os_prefs", prefs); renderList(); });
$("look-form").addEventListener("submit", function (e) { e.preventDefault(); lookup($("look-q").value); });
document.addEventListener("visibilitychange", function () { if (!document.hidden && S.data && !DEMO) schedule(500); });
